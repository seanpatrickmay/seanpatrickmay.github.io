name: Update Hardcover data

on:
  schedule:
    - cron: "8 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: "update-hardcover"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Hardcover data
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: node scripts/update_hardcover.mjs

      - name: Commit & push changes
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain public/hardcover.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/hardcover.json
            git commit -m "chore(hardcover): daily refresh"
            git push
          else
            echo "No changes to commit."
          fi
