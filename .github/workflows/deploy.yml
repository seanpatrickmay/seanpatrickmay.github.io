name: Deploy Portfolio to GitHub Pages

on:
  schedule:
    - cron: "3 13 * * *"  # 13:00 UTC ~ 9:00 AM ET during DST
  push:
    branches: [ "main" ]
  # Data refreshes are pushed by github-actions[bot] using GITHUB_TOKEN, and
  # GitHub deliberately does not fire `push` workflows for those commits (loop
  # prevention). Without this, fresh data sat in the repo un-deployed until the
  # next human push or the daily cron — up to ~24h of stale numbers on a page
  # whose whole point is being live.
  workflow_run:
    workflows:
      - "Update Goodreads data"
      - "Update Spotify data"
      - "Update Garmin stats.json"
    types: [ completed ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # A failed refresh has nothing new to publish.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build (Next.js static export)
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

